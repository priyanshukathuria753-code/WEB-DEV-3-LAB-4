<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Secure Connect Chat</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; }
    input { padding: 6px; margin: 4px 0; }
    #messages { border: 1px solid #aaa; height: 300px; overflow-y: auto; padding: 8px; margin: 10px 0; }
    .system { color: gray; font-style: italic; }
    #chatBox { display: none; }
  </style>
</head>
<body>
  <h2>Secure Connect Chat</h2>

  <!-- Signup / Login -->
  <div id="loginBox">
    <input id="username" placeholder="Username (only for signup)" /><br />
    <input id="email" placeholder="Email" /><br />
    <input id="password" type="password" placeholder="Password" /><br />
    <button onclick="signup()">Signup</button>
    <button onclick="login()">Login</button>
    <p id="info"></p>
  </div>

  <!-- Chat -->
  <div id="chatBox">
    <div id="messages"></div>
    <small id="typing"></small><br />
    <input id="text" placeholder="Type a message..." style="width:70%" oninput="socket.emit('typing')" />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    var socket;

    function addMessage(text, className) {
      var div = document.createElement('div');
      div.textContent = text;
      if (className) div.className = className;
      var box = document.getElementById('messages');
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function signup() {
      fetch('/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        document.getElementById('info').textContent = data.message + ' - now click Login';
      });
    }

    function login() {
      fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        })
      })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (!data.token) {
          document.getElementById('info').textContent = data.message;
          return;
        }
        connectChat(data.token);
      });
    }

    function connectChat(token) {
      socket = io({ auth: { token: token } });   // send the JWT to the server

      socket.on('connect', function () {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('chatBox').style.display = 'block';
      });
      socket.on('connect_error', function (err) {
        document.getElementById('info').textContent = err.message;
      });
      socket.on('oldMessages', function (list) {
        list.forEach(function (m) { addMessage(m.username + ': ' + m.text); });
      });
      socket.on('newMessage', function (m) { addMessage(m.username + ': ' + m.text); });
      socket.on('systemMessage', function (t) { addMessage(t, 'system'); });
      socket.on('typing', function (name) {
        document.getElementById('typing').textContent = name + ' is typing...';
        setTimeout(function () { document.getElementById('typing').textContent = ''; }, 1000);
      });
    }

    function sendMessage() {
      var input = document.getElementById('text');
      socket.emit('sendMessage', input.value);
      input.value = '';
    }
  </script>
</body>
</html>
